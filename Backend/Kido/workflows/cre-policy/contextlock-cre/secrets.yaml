# ==========================================================================
# CRE SECRETS FILE — ContextLock confidential policy
# ==========================================================================
# Maps the secret ids the workflow requests with `runtime.getSecret({ id })` to the environment
# variables holding their values.
#
# In a Confidential Workflow these are released by the Vault DON directly into the attested
# enclave — never exposed in plaintext to node operators or Workflow DON node memory.
#
# The VALUES are confidential. This workflow's source and compiled binary are NOT: the Workflow
# DON provides the binary to the enclave. ContextLock never claims its policy algorithm is secret.
secretsNames:
    CONTEXTLOCK_PRIVATE_POLICY:
        - SECRET_CONTEXTLOCK_PRIVATE_POLICY
    CONTEXTLOCK_RISK_API_TOKEN:
        - SECRET_CONTEXTLOCK_RISK_API_TOKEN
